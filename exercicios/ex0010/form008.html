<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <h1>Formularios</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="ini">Número 1</label>
            <input type="number" name="numero1" id="ini" min="0" max="50" step="1" oninput="isoma.innerHTML = Number(ini.value) + Number(ini2.value)">
        </p>

        <p>
            <label for="ini2">Número 2</label>
            <input type="number" name="numero2" id="ini2" min="0" max="50" step="1" oninput="isoma.innerHTML = Number(ini.value) + Number(ini2.value)">
        </p>

        <p>
            <label for="isoma">Soma: </label>
            <output name="soma" id="isoma">0</output>
        </p>

        <p>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>
