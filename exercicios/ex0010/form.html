<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        form {
            padding: 10px;
            width: 200px;
            margin: auto;
            background-color: blue;
            border-radius: 20px;
            height: auto;
        }

        form > h1 {
            text-align: center;
            font-size: 25px;
        }

        input {
            border-radius: 20px;
            border: none;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Teste de formulario</h1>

    <form action="cadastro.go" method="post">
        <h1>Login</h1>

        <p><label for="iusuario">Usuário</label> 
            <input type="text" name="usuario" id="iusuario" required placeholder="Nome do usuario"></p>

        <p><label for="isenha">Senha</label>
            <input type="password" name="senha" id="isenha" required placeholder="Senha"></p>
        
        <p>
            <input type="submit" value="Login" class="inp">
            <input type="reset" value="limpar">
            
        </p>
    </form>

</body>
</html>
