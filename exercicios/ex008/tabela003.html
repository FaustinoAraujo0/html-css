<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 300px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Teste</h1>
    <table>
        <tr>
            <td colspan="2">A</td>
            <td rowspan="2">C</td>
        </tr>
        <tr>
 
            <td colspan="2">E</td>
        </tr>
        <tr>
            <td colspan="2" rowspan="
            2">G</td>
            
            <td>I</td>
        </tr>
        <tr>
            
            
            <td>M</td>
        </tr>
    </table>
</body>
</html>
