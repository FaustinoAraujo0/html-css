<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <STYLE>
        div.container {
            background-color: green;
            display: flex;

            flex-flow: row nowrap;
        }

        div.item {
            background-color: red;
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;

            
        }
    </STYLE>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb</div>
        <div class="item">Ccccccccccccc</div>
        <div class="item">D</div>
        <div class="item">Eeeeeeeeeeeeeeeeeeeeeeeeeeee</div>
        <div class="item">F</div>
        <div class="item">Ggggggggggggggg</div>
    </div>
</body>
</html>
